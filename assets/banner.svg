<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#101830"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#4f8ef7;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#4f8ef7;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f8ef7;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#4f8ef7;stop-opacity:0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow1)"/>
  <rect width="1200" height="360" fill="url(#glow2)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.05" stroke="#8b949e">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="120" cy="80" r="60" fill="none" stroke="#4f8ef7" stroke-width="1" opacity="0.08"/>
  <circle cx="1080" cy="280" r="80" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.08"/>
  <circle cx="950" cy="60" r="30" fill="none" stroke="#4f8ef7" stroke-width="0.8" opacity="0.06"/>
  <circle cx="250" cy="300" r="45" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity="0.06"/>
  <circle cx="600" cy="180" r="200" fill="none" stroke="#4f8ef7" stroke-width="0.5" opacity="0.04"/>

  <!-- Decorative lines -->
  <line x1="80" y1="310" x2="1120" y2="310" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>
  <line x1="80" y1="314" x2="1120" y2="314" stroke="url(#accent)" stroke-width="0.5" opacity="0.15"/>

  <!-- Decorative path arcs -->
  <path d="M 100 320 Q 300 280 500 320" fill="none" stroke="#4f8ef7" stroke-width="0.7" opacity="0.1"/>
  <path d="M 700 320 Q 900 280 1100 320" fill="none" stroke="#a78bfa" stroke-width="0.7" opacity="0.1"/>

  <!-- Small dots -->
  <circle cx="180" cy="140" r="2" fill="#4f8ef7" opacity="0.2"/>
  <circle cx="1020" cy="120" r="2" fill="#a78bfa" opacity="0.2"/>
  <circle cx="350" cy="250" r="1.5" fill="#4f8ef7" opacity="0.15"/>
  <circle cx="850" cy="230" r="1.5" fill="#a78bfa" opacity="0.15"/>
  <circle cx="500" cy="100" r="1.5" fill="#4f8ef7" opacity="0.12"/>
  <circle cx="700" cy="260" r="2" fill="#a78bfa" opacity="0.12"/>

  <!-- Headline -->
  <text x="600" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52.0" font-weight="bold" fill="#ffffff">
    <tspan x="600" dy="0">Gemini 2.0 Pro Vision</tspan>
    <tspan x="600" dy="60">Unfiltered</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9">
    <tspan x="600" dy="0">No more manual prompt filtering — a desktop kit for</tspan>
    <tspan x="600" dy="30">developers and researchers working with Gemini 2.0 Pro Vi…</tspan>
  </text>
</svg>